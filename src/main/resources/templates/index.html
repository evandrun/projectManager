<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 720px;">
    <h1 class="fw-bold mb-4">Projects</h1>

    <div th:each="project : ${projects}" class="card mb-3 border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <h2 class="h5 mb-1" th:text="${project.name}">Project name</h2>
                <span class="text-primary fw-semibold" th:text="${project.progress} + '% done'">0% done</span>
            </div>
            <p class="text-secondary mb-2" th:text="${project.description}">Description</p>
            <div class="progress mb-3" style="height: 10px;">
                <div class="progress-bar" th:style="'width: ' + ${project.progress} + '%'"></div>
            </div>
            <ul class="list-group">
                <li th:each="task : ${project.tasks}" class="list-group-item d-flex justify-content-between">
                    <span th:text="${task.description}">Task</span>
                    <span class="fw-semibold" th:text="${task.status}">Status</span>
                </li>
            </ul>
            <p class="small text-secondary mt-2 mb-0" th:text="'Due ' + ${project.dueDate}">Due date</p>
        </div>
    </div>
</div>
</body>
</html>
